<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dear Aqila ♡</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Great+Vibes&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="cover">

        <div class="stars" id="stars"></div>

        <div class="horizon"></div>
        <div class="silhouette"></div>

        <div class="petals" id="petals"></div>

        <section class="letter">

            <div class="ornament">♡ ✦ ♡</div>

            <p class="eyebrow">
                SEBUAH SURAT KECIL UNTUKMU
            </p>

            <h1>
                Dear <span>Aqila</span>
            </h1>

            <p class="intro">
                Jika benar, di penghujung kehidupan kita
                diberi kesempatan beberapa menit
                untuk kembali mengenang segala hal
                yang pernah membuat kita bahagia...
            </p>

            <p class="highlight">
                maka, aku ingin kamu menjadi bagian
                <br>
                dari 3 menit terakhirku.
            </p>

            <button id="continueBtn" type="button">
                Buka cerita selanjutnya
                <span>→</span>
            </button>

            <p class="hint" id="hint">
                Ada hal yang ingin kusampaikan kepadamu
            </p>

        </section>

        <div class="scroll-mark">
            <span></span>
        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
